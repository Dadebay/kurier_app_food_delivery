name: a7_tagam_kurier
description: >
  A7-TAGAM Kurier — courier tracking application.
  Assigned orders, in-app routing on our own map server, one-touch statuses,
  cash + change confirmation and live position reporting every 3–5 minutes.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# ════════════════════════════════════════════════════════════════
#  DEPENDENCIES
# ════════════════════════════════════════════════════════════════
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_localizations:
    sdk: flutter

  # ─── State Management ────────────────────────────────────────
  provider: ^6.1.2

  # ─── Networking ──────────────────────────────────────────────
  dio: ^5.8.0+1
  dio_cache_interceptor: ^3.5.1
  connectivity_plus: ^7.1.1

  # ─── Maps & Location ─────────────────────────────────────────
  # Tiles come from our own map server (see AppConfig.mapTileUrl) — no
  # per-request billing and no dependency on a foreign service.
  flutter_map: ^8.1.1
  flutter_map_cache: ^1.5.2
  latlong2: ^0.9.1
  location: ^8.0.0

  # ─── Storage & Cache ─────────────────────────────────────────
  # Hive backs both the tile cache and the offline status queue, so a
  # courier who loses signal keeps working and syncs when it returns.
  hive_flutter: ^1.1.0
  dio_cache_interceptor_hive_store: ^4.0.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # ─── Icons & UI ──────────────────────────────────────────────
  hugeicons: ^1.1.7
  flutter_svg: ^2.0.12
  # Plays the looping scooter clip used as the loading animation.
  video_player: ^2.9.2
  # Confetti burst on the delivery-success dialog.
  lottie: ^3.3.0

  # ─── Utilities ───────────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^22.3.0
  wifi_scan: ^0.4.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Same package dio_cache_interceptor_hive_store's HiveCacheStore actually
  # opens boxes through — tests use it to give ApiClient's cache store a
  # home directory the way TileCacheService does at real app startup.
  hive_ce: ^2.19.3

# ════════════════════════════════════════════════════════════════
#  FLUTTER
# ════════════════════════════════════════════════════════════════
flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
